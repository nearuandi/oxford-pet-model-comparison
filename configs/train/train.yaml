seed: 42

num_epochs: 20
batch_size: 64
num_workers: 4
pin_memory: true
persistent_workers: true
drop_last: true

amp: true

optimizer:
  name: adamw
  lr: 3.0e-4
  weight_decay: 1.0e-4
  betas: [0.9, 0.999]

scheduler:
  name: reduce_on_plateau
  mode: min
  factor: 0.5
  patience: 2
  min_lr: 1.0e-6
  threshold: 1.0e-4

save:
  keep_last: false